<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Level Times</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ccc; padding: 4px 8px; }
        th { background: #eee; }
        input[type="number"] { width: 70px; }
    </style>
</head>
<body>
    <h2>Set Times for 50 Levels (Indexes 0-49)</h2>
    <form id="timesForm">
        <table>
            <thead>
                <tr>
                    <th>Level</th>
                    <th>3 Stars (sec)</th>
                    <th>2 Stars (sec)</th>
                    <th>1 Star (sec)</th>
                </tr>
            </thead>
            <tbody id="levelsTable"></tbody>
        </table>
        <button type="button" onclick="downloadJSON()">Save</button>
    </form>
    <script>
        const levelCount = 50;
        const tbody = document.getElementById('levelsTable');

        for (let i = 0; i < levelCount; i++) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>Level ${i}</td>
                <td><input type="number" step="0.01" min="0" name="level${i}_3" required></td>
                <td><input type="number" step="0.01" min="0" name="level${i}_2" required></td>
                <td><input type="number" step="0.01" min="0" name="level${i}_1" required></td>
            `;
            tbody.appendChild(row);
        }

        function downloadJSON() {
            const form = document.getElementById('timesForm');
            const data = [];
            for (let i = 0; i < levelCount; i++) {
                const s3 = parseFloat(form[`level${i}_3`].value);
                const s2 = parseFloat(form[`level${i}_2`].value);
                const s1 = parseFloat(form[`level${i}_1`].value);
                if (isNaN(s3) || isNaN(s2) || isNaN(s1)) {
                    alert(`Check values for Level ${i}`);
                    return;
                }
                data.push({
                    level: i,
                    times: {
                        "3star": s3,
                        "2star": s2,
                        "1star": s1
                    }
                });
            }
            const jsonText = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonText], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "levels.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
